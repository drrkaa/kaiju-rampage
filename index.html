             Q / E / SPACE = abilities (unlocked via level-up cards) | M = mute

     #t=170    start the run clock at 170s (bosses arrive at 180s, 360s, 600s)

  [45,  2.2, 0.00, 0.00],
  [60,  2.4, 0.04, 0.00],
  [105, 2.8, 0.08, 0.00],

function spawnCurve(t) {
  const K = SPAWN_CURVE;
  if (t <= K[0][0]) return { rate: K[0][1], tank: K[0][2], heli: K[0][3] };
  for (let i = 1; i < K.length; i++) if (t <= K[i][0]) {
    const a = K[i - 1], b = K[i], u = (t - a[0]) / (b[0] - a[0]);
    return { rate: lerp(a[1], b[1], u), tank: lerp(a[2], b[2], u), heli: lerp(a[3], b[3], u) };
  }
  const l = K[K.length - 1]; return { rate: l[1], tank: l[2], heli: l[3] };
}

const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
let W = 800, H = 600;
const TAU = Math.PI * 2;
const rnd = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const dist = (ax, ay, bx, by) => Math.hypot(ax - bx, ay - by);
const fmtTime = s => Math.floor(s / 60) + ":" + String(Math.floor(s % 60)).padStart(2, "0");
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function distToSeg(px, py, x1, y1, x2, y2) {
  const dx = x2 - x1, dy = y2 - y1;
  const l2 = dx * dx + dy * dy || 1;
  const t = clamp(((px - x1) * dx + (py - y1) * dy) / l2, 0, 1);
  return Math.hypot(px - (x1 + t * dx), py - (y1 + t * dy));
}
function angDiff(a, b) { let d = a - b; while (d > Math.PI) d -= TAU; while (d < -Math.PI) d += TAU; return d; }
const lerp = (a, b, t) => a + (b - a) * t;
// Smooth angular motion: T = {face, vel}. Chases `target` at up to maxRate with limited angular acceleration and a
// braking profile so it never overshoots; always takes the shorter way (committed direction when exactly behind).
function stepTurn(T, target, maxRate, dt, instant) {
  let d = angDiff(target, T.face);
  if (Math.abs(d) > Math.PI - 0.05) d = (T.vel < 0 ? -1 : 1) * Math.abs(d);
  const ad = Math.abs(d);
  if (ad < 0.0015 && Math.abs(T.vel) < 0.05) { T.face = target; T.vel = 0; return; }
  const want = Math.sign(d) * Math.min(maxRate, Math.sqrt(2 * MOVE.turnDecel * ad) * 0.95, ad * MOVE.turnGain);
  if (instant) T.vel = want;
  else {
    const accelerating = T.vel === 0 || (Math.sign(want) === Math.sign(T.vel) && Math.abs(want) > Math.abs(T.vel));
    const a = (accelerating ? MOVE.turnAccel : MOVE.turnDecel) * dt;
    T.vel += clamp(want - T.vel, -a, a);
  }
  if (Math.sign(T.vel) === Math.sign(d) && Math.abs(T.vel) * dt >= ad) { T.face = target; T.vel = 0; return; }   // arrive exactly, no overshoot
  T.face += T.vel * dt;
}
// Move-speed multiplier from the angle between the desired move direction and the facing:
// full speed in the front cone, ramping (smoothstep) to sideMul at 90 deg and backMul at 180.
function speedFactor(moveAng, faceAng) {
  const a = Math.abs(angDiff(moveAng, faceAng));
  const sm = t => t * t * (3 - 2 * t);
  if (a <= MOVE.frontCone) return 1;
  if (a <= Math.PI / 2) return lerp(1, MOVE.sideMul, sm((a - MOVE.frontCone) / (Math.PI / 2 - MOVE.frontCone)));
  return lerp(MOVE.sideMul, MOVE.backMul, sm((a - Math.PI / 2) / (Math.PI / 2)));
}
// Rotate `cur` toward `target` by at most maxStep radians.
function turnToward(cur, target, maxStep) { return cur + clamp(angDiff(target, cur), -maxStep, maxStep); }
// Accelerate / decelerate the player's velocity toward a target velocity.
function approachVel(P, tvx, tvy, dt) {
  const dx = tvx - P.vx, dy = tvy - P.vy, d = Math.hypot(dx, dy);
  const a = (Math.hypot(tvx, tvy) >= Math.hypot(P.vx, P.vy) ? MOVE.accel : MOVE.decel) * dt;
  if (d <= a) { P.vx = tvx; P.vy = tvy; } else { P.vx += dx / d * a; P.vy += dy / d * a; }
}

// ------------------------------------------------------------ SOUND (WebAudio, no files) ---
let AC = null, muted = false;
const sfxLast = {};
function audioInit() {
  if (AC || !FX.sound) return;
  try { const C = window.AudioContext || window.webkitAudioContext; if (C) AC = new C(); } catch (e) { AC = null; }
}
function tone(f0, f1, dur, type, vol) {
  const t = AC.currentTime, o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(Math.max(1, f1), t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t + dur + 0.02);
}
const SFX = {
  swipe: () => tone(420, 110, 0.22, "sawtooth", 0.06), hit: () => tone(160, 50, 0.1, "square", 0.07),
  kill: () => tone(500, 200, 0.05, "triangle", 0.03),
  roar: () => { tone(110, 40, 0.85, "sawtooth", 0.1); tone(170, 60, 0.85, "square", 0.04); },
  breath: () => tone(280, 90, 0.3, "sawtooth", 0.05), windup: () => tone(120, 460, 0.35, "sawtooth", 0.05), stomp: () => tone(90, 28, 0.5, "sine", 0.2),
  tremor: () => tone(60, 24, 0.9, "sine", 0.2), pulse: () => tone(85, 35, 0.2, "sine", 0.09), step: () => tone(70, 38, 0.1, "sine", 0.07),
  fail: () => tone(150, 100, 0.12, "square", 0.04), level: () => tone(380, 820, 0.25, "triangle", 0.07),
};
function sfx(k) {
  if (!AC || muted || paused || !FX.sound) return;
  const n = AC.currentTime;
  if (sfxLast[k] && n - sfxLast[k] < 0.06) return;
  sfxLast[k] = n;
  try { SFX[k](); } catch (e) { /* ignore audio errors */ }
}

let GS = 1; // chunk canvas resolution scale
function resize() {
  const dpr = window.devicePixelRatio || 1;
  GS = Math.min(2, dpr);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = Math.floor(W * dpr); canvas.height = Math.floor(H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener("resize", resize);
resize();

function parseHash() {
  const p = {};
  try {
    const h = (window.location && window.location.hash || "").replace(/^#/, "");
    h.split("&").forEach(kv => { const [k, v] = kv.split("="); if (k) p[k] = v === undefined ? "1" : v; });
  } catch (e) { /* no location (tests) */ }
  return p;
}

// ------------------------------------------------------------------ CITY ---
// Infinite city: a grid of blocks separated by streets. Blocks are generated per
// 2x2 "chunk" deterministically. Each chunk is rendered ONCE to an offscreen
// canvas (ground, parks, parking, cars, buildings with pseudo-3D) and only
// re-rendered when something in it is damaged. Off-screen canvases are freed.
const chunks = new Map();
// Compact persistent damage record: building/car id -> remaining hp (0 = destroyed). Survives chunk eviction.
const bState = new Map();
function persist(id, hp) {
  bState.delete(id); bState.set(id, hp);                       // delete+set keeps Map ordered by recency
  if (bState.size > BSTATE_MAX) { let n = 0; for (const k of bState.keys()) { bState.delete(k); if (++n >= 2000) break; } }
}
// Collision / hit rectangle of a building = its drawn silhouette: footprint plus the roof offset
// (roof is drawn up-left of the footprint by depth*ROOF_OX/OY, so walls + roof span exactly this box).
const ROOF_OX = 0.35, ROOF_OY = 0.7;
function colRect(b) { const d = b.d * (1 - BLDG_SAG * b.stage); return { x: b.x - d * ROOF_OX, y: b.y - d * ROOF_OY, w: b.w + d * ROOF_OX, h: b.h + d * ROOF_OY }; }
const stageOf = b => { if (b.hp <= 0) return DEAD_STAGE; const f = b.hp / b.maxHp; let n = 0; for (const t of BLDG_STAGES) if (f < t) n++; return n; };
const smokers = new Set();          // damaged buildings that emit smoke / fire
let frameNo = 0;
const ROOF_HUES = [210, 30, 0, 40, 190, 260, 15, 120];
const CAR_COLORS = ["#c0392b", "#2980b9", "#d4ac0d", "#ecf0f1", "#27ae60", "#34495e", "#e67e22", "#8e44ad"];

function blockType(bx, by, rng) {
  const r = rng();
  if (bx >= -1 && bx <= 0 && by >= -1 && by <= 0) return "park"; // open spawn area
  return r < 0.70 ? "build" : r < 0.80 ? "park" : r < 0.90 ? "parking" : "plaza";
}

function getChunk(cx, cy) {
  const key = cx + "," + cy;
  let c = chunks.get(key);
  if (c) { c.last = frameNo; return c; }
  c = { cx, cy, b: [], cars: [], trees: [], blocks: [], canvas: null, dirty: true, last: frameNo };
  for (let i = 0; i < 2; i++) for (let j = 0; j < 2; j++) {
    const bx = cx * 2 + i, by = cy * 2 + j;
    const rng = mulberry32((bx * 73856093) ^ (by * 19349663) ^ 0x51ed27);
    const type = blockType(bx, by, rng);
    c.blocks.push({ bx, by, type });
    const x0 = bx * BLOCK, y0 = by * BLOCK, lx = x0 + 32, ly = y0 + 32;
    if (type === "build") genBuildings(c, rng, lx, ly);
    else if (type === "parking") genParking(c, rng, lx, ly);
    else if (type === "park") genTrees(c, bx, by, lx, ly);
    // a few cars parked along the street on the block's top / left edges (lane inside this block)
    const n1 = Math.floor(rng() * 4);
    for (let k = 0; k < n1; k++) c.cars.push(mkCar(rng, x0 + 34 + rng() * (BLOCK - 80), y0 + 6, 22, 11));
    const n2 = Math.floor(rng() * 4);
    for (let k = 0; k < n2; k++) c.cars.push(mkCar(rng, x0 + 6, y0 + 34 + rng() * (BLOCK - 80), 11, 22));
  }
  c.cars.forEach((car, i) => { car.id = "car" + cx + "," + cy + ":" + i; if (bState.get(car.id) === 0) car.dead = true; });
  c.trees.forEach((t, i) => { t.id = "tree" + cx + "," + cy + ":" + i; if (bState.get(t.id) === 0) t.dead = true; });
  chunks.set(key, c);
  return c;
}
function mkCar(rng, x, y, w, h) {
  return { x, y, w, h, col: CAR_COLORS[Math.floor(rng() * CAR_COLORS.length)], dead: false };
}
// Trees are small, flat-looking canopies that get trampled (removed) when walked over.
function genTrees(c, bx, by, lx, ly) {
  const rng = mulberry32(bx * 9176 + by * 4421 + 7);
  for (let i = 0; i < 13; i++) {
    const tx = lx + 10 + rng() * 140, ty = ly + 10 + rng() * 140, tr = 6 + rng() * 4, hue = 105 + rng() * 25, lum = 30 + rng() * 10;
    if ((tx > lx + 66 && tx < lx + 94) || (ty > ly + 66 && ty < ly + 94) || dist(tx, ty, lx + 38, ly + 38) < 28) continue;
    c.trees.push({ x: tx, y: ty, r: tr, hue, lum, dead: false });
  }
}
function crushTrees(x, y, r) {
  const x0 = Math.floor((x - r - 12) / CHUNK), x1 = Math.floor((x + r + 12) / CHUNK);
  const y0 = Math.floor((y - r - 12) / CHUNK), y1 = Math.floor((y + r + 12) / CHUNK);
  for (let cx = x0; cx <= x1; cx++) for (let cy = y0; cy <= y1; cy++) {
    const ch = getChunk(cx, cy);
    for (const t of ch.trees) {
      if (t.dead || dist(t.x, t.y, x, y) > t.r + r) continue;
      t.dead = true; ch.dirty = true; persist(t.id, 0);
      for (let i = 0; i < 4; i++) addParticle(t.x, t.y, rnd(-60, 60), rnd(-60, 60), 0.5, 3, "#5fa352");
    }
  }
}
function genParking(c, rng, lx, ly) {
  for (let row = 0; row < 2; row++) for (let s = 0; s < 10; s++) {
    if (rng() < 0.55) c.cars.push(mkCar(rng, lx + 10 + s * 14 + 1.5, (row ? ly + 160 - 8 - 24 : ly + 8) + 1, 11, 22));
  }
}
function genBuildings(c, rng, lx, ly) {
  const L = 160, r = rng();
  const add = (x, y, w, h) => addBuilding(c, rng, x, y, w, h);
  if (r < 0.2) add(lx + 4, ly + 4, L - 8, L - 8);
  else if (r < 0.45) { const w1 = L * (0.4 + rng() * 0.2); add(lx + 4, ly + 4, w1 - 6, L - 8); add(lx + w1 + 2, ly + 4, L - w1 - 6, L - 8); }
  else if (r < 0.7) { const h1 = L * (0.4 + rng() * 0.2); add(lx + 4, ly + 4, L - 8, h1 - 6); add(lx + 4, ly + h1 + 2, L - 8, L - h1 - 6); }
  else {
    const w1 = L * (0.4 + rng() * 0.2), h1 = L * (0.4 + rng() * 0.2);
    const q = [[lx + 4, ly + 4, w1 - 6, h1 - 6], [lx + w1 + 2, ly + 4, L - w1 - 6, h1 - 6],
               [lx + 4, ly + h1 + 2, w1 - 6, L - h1 - 6], [lx + w1 + 2, ly + h1 + 2, L - w1 - 6, L - h1 - 6]];
    for (const a of q) if (rng() > 0.15) add(a[0], a[1], a[2], a[3]);
  }
}
function addBuilding(c, rng, x, y, w, h) {
  if (w < 26 || h < 26) return;
  const t = rng();
  const d = t < 0.35 ? 10 + rng() * 8 : t < 0.8 ? 14 + rng() * 12 : 24 + rng() * 11; // visual height
  const hue = ROOF_HUES[Math.floor(rng() * ROOF_HUES.length)], sat = 8 + rng() * 20, lum = 48 + rng() * 16;
  const k = rng();
  const kind = (d >= 22 && w >= 60 && h >= 60 && k < 0.5) ? "helipad" : k < 0.4 ? "tank" : k < 0.55 ? "antenna" : k < 0.7 ? "skylight" : "ac";
  const hp = (30 + (w * h) / 45) * (0.7 + d / 18) * BLDG_HP_MUL;
  const b = { id: c.cx + "," + c.cy + ":" + c.b.length, x, y, w, h, d, floors: Math.max(1, Math.round(d / 7)), kind,
    roof: `hsl(${hue},${sat}%,${lum}%)`, wallS: `hsl(${hue},${sat}%,${lum - 26}%)`, wallE: `hsl(${hue},${sat}%,${lum - 34}%)`,
    hp, maxHp: hp, stage: 0, dead: false, shot: -1, seed: Math.floor(rng() * 1e6), chunk: c };
  const saved = bState.get(b.id);
  if (saved !== undefined) { b.hp = saved; b.dead = saved <= 0; b.stage = stageOf(b); }
  if (!b.dead && b.stage >= SMOKE.minStage) smokers.add(b);
  c.b.push(b);
}

// call fn(b) for every live building whose footprint touches the circle
function buildingsInCircle(x, y, r, fn) {
  const x0 = Math.floor((x - r) / CHUNK), x1 = Math.floor((x + r) / CHUNK);
  const y0 = Math.floor((y - r) / CHUNK), y1 = Math.floor((y + r) / CHUNK);
  for (let cx = x0; cx <= x1; cx++) for (let cy = y0; cy <= y1; cy++) {
    const list = getChunk(cx, cy).b;
    for (let i = 0; i < list.length; i++) {
      const b = list[i];
      if (b.dead) continue;
      const d = b.d * (1 - BLDG_SAG * b.stage), ox = d * ROOF_OX, oy = d * ROOF_OY, qx = b.x - ox, qy = b.y - oy;   // == colRect(b)
      const nx = clamp(x, qx, qx + b.w + ox), ny = clamp(y, qy, qy + b.h + oy);
      if ((nx - x) * (nx - x) + (ny - y) * (ny - y) <= r * r) fn(b);
    }
  }
}
// true if any intact building's solid box touches the circle (early exit, no callback)
function anySolid(x, y, r) {
  const x0 = Math.floor((x - r) / CHUNK), x1 = Math.floor((x + r) / CHUNK);
  const y0 = Math.floor((y - r) / CHUNK), y1 = Math.floor((y + r) / CHUNK);
  for (let cx = x0; cx <= x1; cx++) for (let cy = y0; cy <= y1; cy++) {
    const list = getChunk(cx, cy).b;
    for (let i = 0; i < list.length; i++) {
      const b = list[i];
      if (b.dead) continue;
      const d = b.d * (1 - BLDG_SAG * b.stage), ox = d * ROOF_OX, oy = d * ROOF_OY, qx = b.x - ox, qy = b.y - oy;
      const nx = clamp(x, qx, qx + b.w + ox), ny = clamp(y, qy, qy + b.h + oy);
      if ((nx - x) * (nx - x) + (ny - y) * (ny - y) < r * r) return true;
    }
  }
  return false;
}
// Push circle-object `o` (radius R) out of building b's solid box; sets PUSH_UX/UY to the contact normal.
let PUSH_UX = 0, PUSH_UY = 0;
function pushOutOf(b, o, R) {
  const q = colRect(b), nx = clamp(o.x, q.x, q.x + q.w), ny = clamp(o.y, q.y, q.y + q.h);
  const dx = o.x - nx, dy = o.y - ny, d = Math.hypot(dx, dy);
  let ux, uy;
  if (d > 1e-6) { if (d >= R) return false; ux = dx / d; uy = dy / d; o.x += ux * (R - d); o.y += uy * (R - d); }
  else {                                     // centre inside the box: leave by the nearest side
    const l = o.x - q.x, r = q.x + q.w - o.x, t = o.y - q.y, bt = q.y + q.h - o.y, m = Math.min(l, r, t, bt);
    if (m === l) { ux = -1; uy = 0; } else if (m === r) { ux = 1; uy = 0; } else if (m === t) { ux = 0; uy = -1; } else { ux = 0; uy = 1; }
    o.x += ux * (m + R); o.y += uy * (m + R);
  }
  PUSH_UX = ux; PUSH_UY = uy;
  return true;
}
// nearest free spot around (x,y) for a ground unit of radius r (falls back to (x,y))
function freeSpot(x, y, r) {
  if (!anySolid(x, y, r + 2)) return { x, y };
  for (let ring = 1; ring <= 5; ring++) for (let k = 0; k < 8; k++) {
    const a = k * TAU / 8 + ring, px = x + Math.cos(a) * ring * 24, py = y + Math.sin(a) * ring * 24;
    if (!anySolid(px, py, r + 2)) return { x: px, y: py };
  }
  return { x, y };
}
function crushCars(x, y, r) {
  crushTrees(x, y, r);
  const x0 = Math.floor((x - r) / CHUNK), x1 = Math.floor((x + r) / CHUNK);
  const y0 = Math.floor((y - r) / CHUNK), y1 = Math.floor((y + r) / CHUNK);
  for (let cx = x0; cx <= x1; cx++) for (let cy = y0; cy <= y1; cy++) {
    const ch = getChunk(cx, cy);
    for (const car of ch.cars) {
      if (car.dead) continue;
      const nx = clamp(x, car.x, car.x + car.w), ny = clamp(y, car.y, car.y + car.h);
      if ((nx - x) * (nx - x) + (ny - y) * (ny - y) <= r * r) {
        car.dead = true; ch.dirty = true; persist(car.id, 0);
        for (let i = 0; i < 5; i++) addParticle(car.x + car.w / 2, car.y + car.h / 2, rnd(-80, 80), rnd(-80, 80), 0.5, 3, "#ffb347");
      }
    }
  }
}

function damageBuilding(b, d) {
  if (b.dead || paused || state === "levelup") return;
  b.hp -= d; persist(b.id, Math.max(0, Math.round(b.hp)));
  const stage = stageOf(b);
  b.hitFlash = BLDG_SHAKE_TIME; b.barT = BLDG_HPBAR_TIME;
  if (!b.inList && G.dmgList.length < 80) { b.inList = true; G.dmgList.push(b); }
  if (stage !== b.stage) {
    b.stage = stage; b.chunk.dirty = true;
    if (stage >= SMOKE.minStage && stage < DEAD_STAGE) smokers.add(b);
    for (let i = 0; i < 6; i++) addParticle(b.x + Math.random() * b.w, b.y + Math.random() * b.h, rnd(-60, 60), rnd(-60, 60), 0.5, 4, "#999");
  }
  if (stage === DEAD_STAGE) {
    b.dead = true; G.destroyed++; smokers.delete(b);
    G.bldgXp += awardXp(buildingXp(b), b.x + b.w / 2, b.y + b.h / 2, true);          // instant XP + small label; restored-destroyed buildings never reach this
    G.shake = Math.max(G.shake, 5);
    for (let i = 0; i < 16; i++)
      addParticle(b.x + Math.random() * b.w, b.y + Math.random() * b.h, rnd(-130, 130), rnd(-130, 130), rnd(0.4, 0.9), rnd(3, 7), i % 3 ? "#8a8a8a" : "#c9b27a");
  } else if (Math.random() < 0.15) {
    addParticle(b.x + Math.random() * b.w, b.y + Math.random() * b.h, rnd(-50, 50), rnd(-50, 50), 0.4, 3, "#aaa");
  }
}

const buildingXp = b => clamp(BLDG_XP.base + b.w * b.h * BLDG_XP.perArea + b.d * BLDG_XP.perHeight, BLDG_XP.min, BLDG_XP.max);
// seeded noise helper for deterministic decoration
const rs = (seed, i) => { const v = Math.sin(seed * 12.9898 + i * 78.233) * 43758.5453; return v - Math.floor(v); };

function renderChunk(c) {
  // Double buffered: paint into a spare canvas, then swap, so the on-screen canvas is never blank/half-painted.
  let target = c.spare;
  if (!target) { target = document.createElement("canvas"); target.width = target.height = Math.round(CHUNK * GS); }
  const g = target.getContext("2d");
  const X0 = c.cx * CHUNK, Y0 = c.cy * CHUNK;
  g.setTransform(GS, 0, 0, GS, -X0 * GS, -Y0 * GS);
  // --- asphalt, lane dashes, crosswalks
  g.fillStyle = "#42464e"; g.fillRect(X0, Y0, CHUNK, CHUNK);
  g.fillStyle = "rgba(235,200,70,.6)";
  for (let k = 0; k <= 2; k++) for (let t = 0; t < CHUNK; t += 28) {
    const m = t % BLOCK;
    if (m < 40 || m > BLOCK - 40) continue;
    g.fillRect(X0 + k * BLOCK - 1, Y0 + t, 2, 14);
    g.fillRect(X0 + t, Y0 + k * BLOCK - 1, 14, 2);
  }
  g.fillStyle = "rgba(235,235,235,.75)";
  for (let ix = 0; ix <= 2; ix++) for (let iy = 0; iy <= 2; iy++) {
    const px = X0 + ix * BLOCK, py = Y0 + iy * BLOCK;
    for (let s = -20; s <= 20; s += 8) {
      g.fillRect(px + s - 2, py - 38, 4, 10); g.fillRect(px + s - 2, py + 28, 4, 10);
      g.fillRect(px - 38, py + s - 2, 10, 4); g.fillRect(px + 28, py + s - 2, 10, 4);
    }
  }
  // --- blocks: sidewalk + lot
  for (const blk of c.blocks) {
    const x0 = blk.bx * BLOCK, y0 = blk.by * BLOCK, lx = x0 + 32, ly = y0 + 32;
    g.fillStyle = "#a9acb1"; g.fillRect(x0 + 24, y0 + 24, BLOCK - 48, BLOCK - 48);
    g.strokeStyle = "#80848a"; g.lineWidth = 2; g.strokeRect(x0 + 24, y0 + 24, BLOCK - 48, BLOCK - 48);
    const rng = mulberry32(blk.bx * 9176 + blk.by * 4421 + 7);
    if (blk.type === "build") {
      g.fillStyle = "#9a9da3"; g.fillRect(lx, ly, 160, 160);
    } else if (blk.type === "park") {          // flat grass, paths, pond; trees come from c.trees
      g.fillStyle = "#62a655"; g.fillRect(lx, ly, 160, 160);
      g.fillStyle = "rgba(255,255,255,.06)";
      for (let k = 0; k < 160; k += 32) g.fillRect(lx + k, ly, 16, 160);
      g.fillStyle = "rgba(222,206,160,.95)"; g.fillRect(lx, ly + 70, 160, 20); g.fillRect(lx + 70, ly, 20, 160);
      g.fillStyle = "rgba(160,140,100,.5)";
      for (let k = 0; k < 160; k += 10) { g.fillRect(lx + k, ly + 78, 5, 4); g.fillRect(lx + 78, ly + k, 4, 5); }
      g.fillStyle = "#79c3e6"; g.beginPath(); g.ellipse(lx + 38, ly + 38, 22, 15, 0, 0, TAU); g.fill();
      g.strokeStyle = "rgba(255,255,255,.5)"; g.lineWidth = 2; g.stroke();
    } else if (blk.type === "parking") {
      g.fillStyle = "#4d5058"; g.fillRect(lx, ly, 160, 160);
      g.fillStyle = "rgba(255,255,255,.85)";
      for (let row = 0; row < 2; row++) for (let s = 0; s <= 10; s++)
        g.fillRect(lx + 10 + s * 14, row ? ly + 160 - 8 - 24 : ly + 8, 2, 24);
      g.fillStyle = "rgba(255,230,90,.7)"; for (let k = 0; k < 160; k += 24) g.fillRect(lx + k + 4, ly + 79, 12, 2);
    } else { // plaza: flat paving, fountain and benches as decals
      g.fillStyle = "#d3d0c4"; g.fillRect(lx, ly, 160, 160);
      g.fillStyle = "rgba(0,0,0,.06)";
      for (let i = 0; i < 8; i++) for (let j = 0; j < 8; j++) if ((i + j) % 2) g.fillRect(lx + i * 20, ly + j * 20, 20, 20);
      g.fillStyle = "#b9b6aa"; g.beginPath(); g.arc(lx + 80, ly + 80, 30, 0, TAU); g.fill();
      g.fillStyle = "#6fb4e0"; g.beginPath(); g.arc(lx + 80, ly + 80, 23, 0, TAU); g.fill();
      g.fillStyle = "#b8e6fa"; g.beginPath(); g.arc(lx + 80, ly + 80, 8, 0, TAU); g.fill();
      g.fillStyle = "#a07850";
      for (const [bx2, by2] of [[20, 20], [128, 20], [20, 134], [128, 134]]) g.fillRect(lx + bx2, ly + by2, 12, 6);
    }
    // street lights at the four sidewalk corners
    for (const [px, py] of [[x0 + 28, y0 + 28], [x0 + BLOCK - 28, y0 + 28], [x0 + 28, y0 + BLOCK - 28], [x0 + BLOCK - 28, y0 + BLOCK - 28]]) {
      g.fillStyle = "rgba(255,230,150,.16)"; g.beginPath(); g.arc(px, py, 13, 0, TAU); g.fill();
      g.fillStyle = "#c8c8c8"; g.beginPath(); g.arc(px, py, 2.5, 0, TAU); g.fill();
    }
  }
  // --- trees: small flat canopies (crushed ones leave a green smear)
  for (const t of c.trees) {
    if (t.dead) { g.fillStyle = "rgba(60,90,40,.45)"; g.beginPath(); g.ellipse(t.x, t.y, t.r * 0.9, t.r * 0.6, 0.5, 0, TAU); g.fill(); continue; }
    g.fillStyle = "rgba(0,0,0,.18)"; g.beginPath(); g.arc(t.x + 2, t.y + 2, t.r, 0, TAU); g.fill();
    g.fillStyle = `hsl(${t.hue},45%,${t.lum + 4}%)`; g.beginPath(); g.arc(t.x, t.y, t.r, 0, TAU); g.fill();
    g.fillStyle = "rgba(255,255,255,.14)"; g.beginPath(); g.arc(t.x - 1.5, t.y - 1.5, t.r * 0.5, 0, TAU); g.fill();
  }
  // --- cars
  for (const car of c.cars) {
    const x = car.x, y = car.y, w = car.w, h = car.h;
    if (car.dead) {
      g.fillStyle = "#1c1c1f"; g.fillRect(x - 1, y - 1, w + 2, h + 2);
      g.fillStyle = "#3b3b40"; g.fillRect(x + 2, y + 2, w - 4, h - 4);
      continue;
    }
    g.fillStyle = "rgba(0,0,0,.3)"; g.fillRect(x + 2, y + 2, w, h);
    g.fillStyle = car.col; g.fillRect(x, y, w, h);
    g.fillStyle = "rgba(20,30,40,.75)";
    if (w > h) { g.fillRect(x + w * 0.3, y + 1.5, w * 0.25, h - 3); g.fillRect(x + w * 0.72, y + 1.5, w * 0.12, h - 3); }
    else { g.fillRect(x + 1.5, y + h * 0.3, w - 3, h * 0.25); g.fillRect(x + 1.5, y + h * 0.72, w - 3, h * 0.12); }
  }
  // --- building shadows first, then buildings back-to-front
  const live = c.b.filter(b => !b.dead);
  for (const b of c.b) {
    if (b.dead) { drawRubble(g, b); continue; }
    const d = b.d * (1 - BLDG_SAG * b.stage), sx = d * 1.1, sy = d * 0.8;
    g.fillStyle = "rgba(0,0,0,.45)"; g.beginPath();
    g.moveTo(b.x, b.y); g.lineTo(b.x + b.w, b.y); g.lineTo(b.x + b.w + sx, b.y + sy);
    g.lineTo(b.x + b.w + sx, b.y + b.h + sy); g.lineTo(b.x + sx, b.y + b.h + sy); g.lineTo(b.x, b.y + b.h);
    g.closePath(); g.fill();
  }
  live.sort((a, b) => (a.y + a.h) - (b.y + b.h));
  for (const b of live) drawBuilding(g, b);
  c.spare = c.canvas; c.canvas = target; c.dirty = false; c.lastRender = frameNo;
}

function drawRubble(g, b) {   // flat, light, low debris: clearly walkable
  g.fillStyle = "#6d675f"; g.fillRect(b.x, b.y, b.w, b.h);
  for (let k = 0; k < 16; k++) {
    g.fillStyle = k % 4 === 0 ? "#b07a4a" : k % 3 ? "#8a847a" : "#a59d90";
    g.fillRect(b.x + rs(b.seed, k) * (b.w - 8), b.y + rs(b.seed, k + 40) * (b.h - 6), 3 + rs(b.seed, k + 80) * 7, 2 + rs(b.seed, k + 120) * 5);
  }

}

function drawBuilding(g, b) {
  const d = b.d * (1 - BLDG_SAG * b.stage), ox = d * ROOF_OX, oy = d * ROOF_OY;
  const x = b.x, y = b.y, w = b.w, h = b.h;
  g.fillStyle = "#0c0e11"; g.fillRect(x - 3, y - 3, w + 6, h + 6);          // thick dark base: reads as a solid object
  // south wall
  g.fillStyle = b.wallS; g.beginPath();

  // east wall
  g.fillStyle = b.wallE; g.beginPath();
  g.moveTo(x + w, y); g.lineTo(x + w, y + h); g.lineTo(x + w - ox, y + h - oy); g.lineTo(x + w - ox, y - oy); g.closePath(); g.fill();
  g.strokeStyle = "rgba(0,0,0,.9)"; g.lineWidth = 3; g.beginPath(); g.moveTo(x - 1, y + h + 1); g.lineTo(x + w + 1, y + h + 1); g.lineTo(x + w + 1, y - 1); g.stroke();

  if (d >= 10) {
    const rows = Math.max(0, Math.min(b.floors, 4) - (b.stage >= 3 ? 2 : b.stage >= 2 ? 1 : 0));
    g.strokeStyle = b.stage ? "rgba(255,220,140,.25)" : "rgba(255,235,160,.55)"; g.lineWidth = 2.2; g.setLineDash([5, 4]);
    for (let k = 1; k <= rows; k++) {

    }
    g.setLineDash([]);
  }

  const rx = x - ox, ry = y - oy;
  g.fillStyle = b.roof; g.fillRect(rx, ry, w, h);
  g.strokeStyle = "rgba(0,0,0,.55)"; g.lineWidth = 2; g.strokeRect(rx + 1, ry + 1, w - 2, h - 2);
  g.strokeStyle = "rgba(255,255,255,.5)"; g.lineWidth = 1.5; g.beginPath(); g.moveTo(rx + 1, ry + h - 1); g.lineTo(rx + 1, ry + 1); g.lineTo(rx + w - 1, ry + 1); g.stroke();   // light rim

  const st = b.stage;

    g.fillStyle = "rgba(25,18,12,.4)";
    for (let k = 0; k < st * 2; k++) {
      g.beginPath(); g.ellipse(rx + rs(b.seed, k + 7) * w, ry + rs(b.seed, k + 17) * h, 4 + rs(b.seed, k) * 8, 3 + rs(b.seed, k + 3) * 6, 0, 0, TAU); g.fill();
    }
    g.strokeStyle = "rgba(0,0,0,.65)"; g.lineWidth = 1.5; g.beginPath();
    g.moveTo(rx + w * 0.2, ry); g.lineTo(rx + w * 0.5, ry + h * 0.5); g.lineTo(rx + w * 0.3, ry + h);
    g.moveTo(x + w * 0.3 - ox * 0.3, y + h - 1); g.lineTo(x + w * 0.36 - ox * 0.6, y + h - oy * 0.55);       // crack on the wall face

      g.moveTo(rx + w, ry + h * 0.3); g.lineTo(rx + w * 0.5, ry + h * 0.5); g.lineTo(rx + w * 0.9, ry + h);
      g.moveTo(x + w * 0.7 - ox * 0.2, y + h - 1); g.lineTo(x + w * 0.62 - ox * 0.8, y + h - oy * 0.8);
      g.moveTo(x + w - 1, y + h * 0.3); g.lineTo(x + w - ox * 0.7, y + h * 0.1 - oy * 0.4);
    }

    g.fillStyle = "rgba(48,34,26,.92)"; jag(g, rx + w * 0.4, ry + h * 0.4, Math.min(w, h) * 0.2, b.seed, 8);

// Irregular polygon (never an axis-aligned rectangle) used for holes / broken chunks.
function jag(g, cx, cy, r, seed, n) {

  }

}

function drawRoofDetail(g, b, rx, ry) {
  const w = b.w, h = b.h, s = b.seed;
  if (b.stage >= 3) return;
  if (b.kind === "helipad") {
    const cx = rx + w / 2, cy = ry + h / 2, r = Math.min(w, h) * 0.32;
    g.strokeStyle = "#e8e8e8"; g.lineWidth = 3; g.beginPath(); g.arc(cx, cy, r, 0, TAU); g.stroke();

  } else if (b.kind === "tank") {
    const cx = rx + w * (0.3 + rs(s, 1) * 0.4), cy = ry + h * (0.3 + rs(s, 2) * 0.4);
    g.fillStyle = "#6b4f3a"; g.beginPath(); g.arc(cx, cy, 9, 0, TAU); g.fill();
    g.fillStyle = "#8a6a50"; g.beginPath(); g.arc(cx - 1.5, cy - 1.5, 6, 0, TAU); g.fill();
    g.fillStyle = "rgba(255,255,255,.2)"; g.beginPath(); g.arc(cx - 3, cy - 3, 2.5, 0, TAU); g.fill();
  } else if (b.kind === "antenna") {
    const cx = rx + w * 0.5, cy = ry + h * 0.5;
    g.strokeStyle = "#333"; g.lineWidth = 1.5; g.beginPath(); g.moveTo(cx - 8, cy - 8); g.lineTo(cx + 8, cy + 8); g.moveTo(cx + 8, cy - 8); g.lineTo(cx - 8, cy + 8); g.stroke();
    g.fillStyle = "#e33"; g.beginPath(); g.arc(cx, cy, 2.5, 0, TAU); g.fill();
  } else if (b.kind === "skylight") {
    g.fillStyle = "rgba(150,200,230,.7)"; g.fillRect(rx + w * 0.25, ry + h * 0.25, w * 0.5, h * 0.5);
    g.strokeStyle = "rgba(255,255,255,.6)"; g.lineWidth = 1; g.strokeRect(rx + w * 0.25, ry + h * 0.25, w * 0.5, h * 0.5);
    g.beginPath(); g.moveTo(rx + w * 0.5, ry + h * 0.25); g.lineTo(rx + w * 0.5, ry + h * 0.75); g.stroke();
  }

  const n = b.kind === "ac" ? 3 : 1;
  for (let k = 0; k < n; k++) {
    const ax = rx + 5 + rs(s, 30 + k) * (w - 22), ay = ry + 5 + rs(s, 50 + k) * (h - 18);
    g.fillStyle = "#9aa0a6"; g.fillRect(ax, ay, 12, 9);
    g.fillStyle = "#555"; g.beginPath(); g.arc(ax + 6, ay + 4.5, 3, 0, TAU); g.fill();
  }
}

function purgeChunks() {
  for (const b of smokers) if (b.dead || b.chunk.evicted) smokers.delete(b);
  for (const c of chunks.values()) if (c.canvas && frameNo - c.last > CHUNK_CANVAS_KEEP) { c.canvas = null; c.spare = null; c.dirty = true; }
  if (chunks.size > CHUNK_DATA_MAX) {
    const arr = [...chunks.entries()].sort((a, b) => a[1].last - b[1].last);
    for (let i = 0; i < arr.length - CHUNK_DATA_MAX * 0.8; i++) { arr[i][1].evicted = true; chunks.delete(arr[i][0]); }
  }
}

// ------------------------------------------------------ ABILITIES / CARDS ---
const SLOT_KEYS = ["q", "e", " "], SLOT_LABELS = ["Q", "E", "SPACE"];
// Abilities live in Q/E/Space slots; `cd` is base cooldown seconds. Level (1-4) scales power and cuts cooldown.

const ABIL_MAXLVL = 4;
const lv = id => G.P.up[id] || 0;
const amul = id => 1 + 0.3 * (lv(id) - 1);
const abilCd = id => ABILS[id].cd * Math.pow(0.87, lv(id) - 1);

// Card text for reaching weapon level `lvl` (>= 2): shows the stat steps and the bonus unlocked.
function weaponDesc(kind, lvl) {

    return `+${b.range - a.range} reach, +${b.dmg - a.dmg} dmg, wider arc, faster` + (lvl === 3 ? ". NEW: follow-up slash!" : lvl === 6 ? ". NEW: crescent wave!" : "");
  }

}
const UPGRADES = [

  { id: "speed", name: "Swift Stomp", max: 5, color: "#8f8", desc: l => "+8% move speed", apply: P => { P.speed *= 1.08; } },
  { id: "hp", name: "Tough Hide", max: 6, color: "#f66", desc: l => "+30 max HP and heal 30", apply: P => { P.maxHp += 30; P.hp = Math.min(P.maxHp, P.hp + 30); } },
  { id: "regen", name: "Regeneration", max: 5, color: "#f66", desc: l => "+0.8 HP per second", apply: P => { P.regen += 0.8; } },
  { id: "xpboost", name: "XP Boost", max: 5, color: "#8f8", desc: l => "+15% XP from every kill", apply: P => { P.xpMul *= 1.15; } },
  { id: "armor", name: "Thick Scales", max: 4, color: "#f66", desc: l => "Take 1 less damage from every hit", apply: P => { P.armor += 1; } },
];
for (const id in ABILS) UPGRADES.push({ id, name: ABILS[id].name, max: ABIL_MAXLVL, color: ABILS[id].color, abil: true,
  desc: l => l === 1 ? `UNLOCK [${SLOT_LABELS[Math.max(0, freeSlot())]}]: ${ABILS[id].desc}` : "-13% cooldown, +30% power",
  apply: P => { if (P.up[id] === 1) { P.slots[P.slots.indexOf(null)] = id; P.cds[id] = 0; } } });

function upgradeAvailable(u) {
  const l = G.P.up[u.id] || 0;
  if (l >= u.max) return false;
  if (u.req && !G.P.up[u.req]) return false;
  if (u.abil && l === 0 && freeSlot() < 0) return false;
  return true;
}
function applyUpgrade(u) {
  const P = G.P;
  P.up[u.id] = (P.up[u.id] || 0) + 1;
  u.apply(P);
}
function rollChoices() {
  const P = G.P;
  const pool = UPGRADES.filter(upgradeAvailable);
  const out = [];
  // early guidance: Atomic Breath is guaranteed among the first level-up cards
  if (!G.breathOffered && !P.up.breath) {          // guarantee Atomic Breath is offered once (first level-up)
    G.breathOffered = true;
    const i = pool.findIndex(u => u.id === "breath"); if (i >= 0) out.push(pool.splice(i, 1)[0]);
  }
  while (out.length < 3 && pool.length) out.push(pool.splice(Math.floor(Math.random() * pool.length), 1)[0]);
  return out;
}
function chooseUpgrade(i) {
  const u = G.choices[i];
  if (!u) return;
  applyUpgrade(u);
  mouse.l = false;
  state = "play";

}
// #lv=N debug: hand out N upgrades in a fixed order
function grantDebugLevels(n) {
  const order = ["breath", "roar", "stomp", "tailspin", "swipe", "breath", "swipe", "tremor", "breath", "swipe", "hp", "speed", "regen", "armor", "xpboost", "mega", "swipe", "breath"];
  let given = 0;
  for (const id of order) {
    if (given >= n) break;
    const u = UPGRADES.find(x => x.id === id);
    if (u && upgradeAvailable(u)) { applyUpgrade(u); given++; }
  }
  G.P.lvl = 1 + n;
}

function addParticle(x, y, vx, vy, life, size, color) {
  if (G.parts.length >= MAX_PARTICLES) return;
  G.parts.push({ x, y, vx, vy, life, max: life, size, color });
}
const bossesAlive = () => G.enemies.filter(e => e.def && !e.dead);

function spawnEnemy(type, x, y) {
  const P = G.P;
  if (type !== "boss" && G.enemies.length >= MAX_ENEMIES) return null;
  const d = ETYPES[type];
  const ground = type !== "heli" && type !== "boss" && ENEMY_NAV.collide;
  if (x === undefined) {
    for (let tries = 0; tries <= ENEMY_NAV.spawnTries; tries++) {      // random ring around the screen edge, retry if inside a building
      const a = Math.random() * TAU, r = Math.hypot(W, H) / 2 + rnd(40, 160);
      x = P.x + Math.cos(a) * r; y = P.y + Math.sin(a) * r;
      if (!ground || !anySolid(x, y, d.r + 2)) break;
    }
  }
  if (ground) { const f = freeSpot(x, y, d.r); x = f.x; y = f.y; }
  const hp = d.hp * (type === "boss" ? 1 : 1 + G.t * SPAWN.hpGrowth);
  const e = { type, x, y, r: d.r, hp, maxHp: hp, speed: d.speed * rnd(0.9, 1.1) * (type === "soldier" ? ENEMY_NAV.soldierSpeedMul : 1), kx: 0, ky: 0, stun: 0,
              cT: 0, cnx: 0, cny: 0, sx: x, sy: y, stT: 0, steerSign: Math.random() < 0.5 ? 1 : -1, steerOff: 0, commitT: 0,
              flash: 0, cd: rnd(0.5, 2), hitCd: 0, dead: false, ang: 0, t: rnd(0, 6),
              strafe: Math.random() < 0.5 ? 1 : -1, dashHit: -1 };
  G.enemies.push(e);
  return e;
}

function spawnBoss(i) {
  const def = BOSSES[i], P = G.P;
  const a = Math.random() * TAU;
  const e = spawnEnemy("boss", P.x + Math.cos(a) * 560, P.y + Math.sin(a) * 560);
  e.def = def; e.bossIdx = i; e.r = def.r; e.hp = e.maxHp = def.hp * BOSS_HP_MUL; e.speed = def.moveSpeed[0];
  e.comboLeft = def.combo[0]; e.lastAtk = null; e.tired = false; e.lift = 0;
  e.phase = 1; e.mode = "idle"; e.modeT = 1.0; e.atk = null; e.at = 0; e.intro = 2.6; e.inv = false; e.spinOn = false;
  e.glow = 0; e.spinA = 0; e.cdir = 0;
  G.introT = 2.6; G.introBoss = def;
  for (const o of G.enemies) if (!o.def && !(o.fleeT > 0)) o.fleeT = BOSS_CLEAR_TIME * rnd(0.8, 1.1);   // existing regular enemies flee + fade out
  banner(def.name, 3);
  G.shake = 12;
  return e;
}

function updateSpawning(dt) {
  const P = G.P;
  const bossUp = bossesAlive().length > 0;
  if (G.nextBoss < BOSS_TIMES.length && G.t >= BOSS_TIMES[G.nextBoss]) spawnBoss(G.nextBoss++);
  const c = spawnCurve(G.t);
  let mul = bossUp ? BOSS_SPAWN_MUL : 1;
  if (!bossUp && G.lastBossDeath !== undefined) mul *= clamp(0.25 + 0.75 * (G.t - G.lastBossDeath) / POST_BOSS_RAMP, 0.25, 1);   // gentle ramp after a boss
  G.spawnAcc += dt * c.rate * mul;
  const cap = bossUp ? MAX_ENEMIES_BOSS : MAX_ENEMIES;
  while (G.spawnAcc >= 1) {
    G.spawnAcc -= 1;
    if (G.enemies.length >= cap) continue;
    const r = Math.random();
    spawnEnemy(r < c.tank ? "tank" : r < c.tank + c.heli ? "heli" : "soldier");
  }
  if (G.t >= G.nextWave) {
    G.nextWave += SPAWN.waveEvery;
    if (!bossUp) {
      banner("SOLDIER WAVE!", 2);
      const r0 = Math.hypot(W, H) / 2 + 60;
      for (let i = 0; i < SPAWN.waveSize; i++) {
        const a = (i / SPAWN.waveSize) * TAU;
        spawnEnemy("soldier", P.x + Math.cos(a) * r0, P.y + Math.sin(a) * r0);
      }
    }
  }
}

// Tail position at spin angle `ang` (the tail trails directly behind the spinning body).
const tailAngle = ang => ang + Math.PI;

// Per-frame progress for the current action (breath is input-driven, see updateBreath).
function updateAction(dt) {
  const P = G.P, a = P.action;
  if (!a) return;
  if (a.type === "breath") { updateBreath(dt); return; }
  a.t += dt;
  if (a.type === "swipe") {
    if (!a.hit && a.t >= SWIPE.wind) { a.hit = true; swipeStrike(a); }
    if (a.hit && !a.hit2 && swipeLevel() >= 3 && a.t >= SWIPE.wind + SWIPE.strike + SWIPE.followDelay) { a.hit2 = true; swipeFollowUp(a); }
  }
  else if (a.type === "roar") {
    if (!a.fired && a.t < ROAR.wind && Math.random() < dt * ROAR.suction) {      // suction dust drawn INTO the mouth
      const m = mouthPos(), an = Math.random() * TAU, d = rnd(50, 95);

    }
    if (!a.fired && a.t >= ROAR.wind) { a.fired = true; doRoar(); }
  }
  else if (a.type === "stomp") { if (!a.fired && a.t >= STOMP.windup) { a.fired = true; doStomp(); } }
  else if (a.type === "tailspin") updateTailSpin(a, dt);
  else if (a.type === "mega") {
    const CH = 0.9, m = amul("mega");
    if (a.t >= CH) {
      a.tick -= dt;
      if (a.tick <= 0) {
        a.tick = 0.06;
        const ang = P.face, sx = P.x + Math.cos(ang) * 30, sy = P.y + Math.sin(ang) * 30;
        const len = 650, ex = P.x + Math.cos(ang) * len, ey = P.y + Math.sin(ang) * len;
        for (const e of G.enemies) {
          if (e.dead) continue;
          if (distToSeg(e.x, e.y, sx, sy, ex, ey) <= 55 + e.r) damageEnemy(e, 22 * m, Math.cos(ang) * 120, Math.sin(ang) * 120);
        }
        const id = ++G.shotId;
        for (let s = 0; s <= len; s += 40) buildingsInCircle(sx + (ex - sx) * s / len, sy + (ey - sy) * s / len, 55, b => { if (b.shot !== id) { b.shot = id; damageBuilding(b, 60 * m); } });
        G.shake = Math.max(G.shake, 5);
      }
    }
  } else if (a.type === "dash") {
    const m = amul("dash");
    for (const e of G.enemies) {
      if (e.dead || e.dashHit === a.id) continue;
      if (dist(e.x, e.y, P.x, P.y) < e.r + 45) { e.dashHit = a.id; damageEnemy(e, 25 * m, Math.cos(a.ang) * 400, Math.sin(a.ang) * 400); }
    }
    buildingsInCircle(P.x, P.y, 48, b => { if (b.shot !== a.id) { b.shot = a.id; damageBuilding(b, 80 * m); } });
  }
  if (P.action === a && a.t >= a.dur) {
    if (a.type === "dash") { P.vx *= 0.1; P.vy *= 0.1; }
    P.action = null;
  }
}

// ---- Tremor: passive stomping pulses around the kaiju (not an action, never blocked) ----
const tremorRadius = () => TREMOR.radius + TREMOR.radiusGrow * (lv("tremor") - 1);
function spawnTremor() {

function updateWaves(dt) {

// ---- player vs buildings: solid, slide along walls, bulldoze when pushing ----
function collidePlayer(dt, pushing) {
  const P = G.P, R = MOVE.collideRadius;
  for (let iter = 0; iter < 3; iter++) {
    let any = false;
    buildingsInCircle(P.x, P.y, R, b => {

      const ux = PUSH_UX, uy = PUSH_UY, vn = P.vx * ux + P.vy * uy;

// Ground enemies: same solid boxes as the player, sliding along walls; knockback velocity into a wall is removed.
function collideEnemy(e) {

  const R = e.r;
  for (let iter = 0; iter < 2; iter++) {
    let any = false;
    buildingsInCircle(e.x, e.y, R, b => {

let STEER_X = 0, STEER_Y = 0;
function steerGround(e, mx, my, dt) {
  const l = Math.hypot(mx, my);

  mx /= l; my /= l;
  e.stT += dt;
  if (e.stT >= ENEMY_NAV.stuckTime) {            // stuck detector
    if (Math.hypot(e.x - e.sx, e.y - e.sy) < e.speed * ENEMY_NAV.stuckProgress * e.stT && !(e.stun > 0)) {

  }

}

function footstep(spd) {
  const P = G.P, side = P.stepIdx % 2 ? 1 : -1, c = Math.cos(P.face), s = Math.sin(P.face);
  const fx = P.x + c * 6 - s * side * 20, fy = P.y + s * 6 + c * side * 20;
  P.stepPulse = 1;
  G.shake = Math.max(G.shake, MOVE.stepShake * Math.min(1, spd / P.speed));
  for (let i = 0; i < MOVE.stepDust; i++) addParticle(fx, fy, rnd(-35, 35), rnd(-35, 35), 0.45, rnd(3, 6), "#9b8f7a");
  for (const e of G.enemies) {
    if (e.dead || e.def || e.r > 10) continue;
    if (dist(e.x, e.y, fx, fy) < MOVE.stepRadius + e.r) damageEnemy(e, MOVE.stepDmg, 0, 0);
  }

// Player-owned (reflected) projectiles hit enemies via the enemy grid + bosses.
function friendlyHit(p, bl) {
  const gx = Math.floor(p.x / GRID), gy = Math.floor(p.y / GRID);
  const hit = e => { damageEnemy(e, p.dmg, p.vx * 0.3, p.vy * 0.3); p.life = 0; };
  for (let i = -1; i <= 1; i++) for (let j = -1; j <= 1; j++) {
    const a = grid.get((gx + i) * 100003 + gy + j);
    if (!a) continue;
    for (const e of a) if (!e.dead && !e.def && dist(e.x, e.y, p.x, p.y) < e.r + p.r + 4) { hit(e); return; }
  }
  for (const b of bl) if (!b.dead && dist(b.x, b.y, p.x, p.y) < b.r + p.r) { hit(b); return; }

// ----------------------------------------------------------------- HAZARDS ---
// Telegraphed attack zones. They show a red warning for `warn` seconds, then are
// live for `dur` seconds. kinds: circle {r}, line {len,w,ang}, sector {len,arc,ang}.
function addHazard(owner, h) {

  h.owner = owner; h.warn0 = h.warn; h.dur0 = h.dur; h.fired = false; h.hit = false; h.tick = 0;
  G.hazards.push(h);
  return h;
}
function hazardHitsPlayer(h) {
  const P = G.P, pr = 20;
  if (h.kind === "circle") return dist(P.x, P.y, h.x, h.y) < h.r + pr;
  if (h.kind === "line") return distToSeg(P.x, P.y, h.x, h.y, h.x + Math.cos(h.ang) * h.len, h.y + Math.sin(h.ang) * h.len) < h.w / 2 + pr;
  if (h.kind === "sector") { const d = dist(P.x, P.y, h.x, h.y); return d < h.len && Math.abs(angDiff(Math.atan2(P.y - h.y, P.x - h.x), h.ang)) < h.arc / 2; }

}
function updateHazards(dt) {
  for (const h of G.hazards) {
    if (h.follow) { if (h.follow.dead) { h.warn = 0; h.dur = 0; continue; } h.x = h.follow.x; h.y = h.follow.y; }
    if (h.warn > 0) { h.warn -= dt; continue; }
    if (!h.fired) {
      h.fired = true;
      if (h.bldg) {
        buildingsInCircle(h.x, h.y, h.r, b => damageBuilding(b, 200));
        crushCars(h.x, h.y, h.r);
        G.shake = Math.max(G.shake, 6);
        for (let i = 0; i < 8; i++) addParticle(h.x + rnd(-h.r, h.r) * 0.6, h.y + rnd(-h.r, h.r) * 0.6, rnd(-90, 90), rnd(-90, 90), 0.5, 4, "#c96");
        ringFx(h.x, h.y, h.r, "255,120,60");
      }
    }
    if (h.rot) h.ang += h.rot * dt;
    h.dur -= dt;
    if (!h.harmless && hazardHitsPlayer(h)) {
      if (h.once) { if (!h.hit) { h.hit = true; hurtPlayer(h.dmg); } }
      else { h.tick -= dt; if (h.tick <= 0) { h.tick = 0.25; hurtPlayer(h.dmg); } }
    }
  }
  G.hazards = G.hazards.filter(h => h.warn > 0 || h.dur > 0);
}

// ----------------------------------------------------------------- BOSS AI ---
// Each attack: start(e) spawns telegraphs, run(e,dt) returns true when finished, rec = recovery seconds.
const BATK = {
  charge: {
    rec: 1.0,
    start(e) {
      const P = G.P, w0 = e.def.id === "omega" ? 1.0 : 0.85;
      e.cdir = Math.atan2(P.y - e.y, P.x - e.x); e.w0 = w0;
      addHazard(e, { kind: "line", x: e.x, y: e.y, ang: e.cdir, len: 720, w: e.r * 1.8, warn: w0, dur: 0.05, harmless: true });
    },

  },

    },

      }
    },

  },
  burst: {

    },

const GRID = 40;
let grid = new Map();
function buildGrid(list) {
  grid = new Map();
  for (const e of list) {
    const k = Math.floor(e.x / GRID) * 100003 + Math.floor(e.y / GRID);
    const a = grid.get(k);
    if (a) a.push(e); else grid.set(k, [e]);

}

  let px = 0, py = 0;
  for (let i = -1; i <= 1; i++) for (let j = -1; j <= 1; j++) {
    const a = grid.get((gx + i) * 100003 + gy + j);
    if (!a) continue;
    for (const o of a) {
      if (o === e) continue;
      const dx = e.x - o.x, dy = e.y - o.y, m = e.r + o.r;
      const d2 = dx * dx + dy * dy;

function updateEnemy(e, dt) {

    e.fleeT -= dt; e.alpha = clamp(e.fleeT / 1, 0, 1);

    ctx.fill();
    ctx.globalCompositeOperation = "lighter";
    for (const p of G.projs) { ctx.fillStyle = p.friendly ? "rgba(70,210,255,.35)" : "rgba(255,110,40,.38)"; ctx.beginPath(); ctx.arc(p.x, p.y, p.r * 2.4, 0, TAU); ctx.fill(); }
    ctx.globalCompositeOperation = "source-over";
    for (const p of G.projs) {
      ctx.fillStyle = p.color; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, TAU); ctx.fill();
      ctx.fillStyle = p.friendly ? "#e8ffff" : "#fff7c8"; ctx.beginPath(); ctx.arc(p.x, p.y, Math.max(1.5, p.r * 0.5), 0, TAU); ctx.fill();
      if (p.friendly) { ctx.strokeStyle = "rgba(160,255,255,.5)"; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x - p.vx * 0.05, p.y - p.vy * 0.05); ctx.stroke(); }
    }
  }
  ctx.globalCompositeOperation = "lighter";
  for (const sm of G.smoke) {                       // smoke puffs / small fires rising from damaged roofs
    const a = clamp(sm.life / sm.max, 0, 1);
    if (sm.fire) { ctx.fillStyle = `rgba(255,${110 + Math.floor(Math.random() * 90)},30,${0.85 * a})`; ctx.beginPath(); ctx.arc(sm.x, sm.y, 2.5 + 2 * a, 0, TAU); ctx.fill(); }
    else { ctx.fillStyle = `rgba(70,70,74,${0.4 * a})`; ctx.beginPath(); ctx.arc(sm.x, sm.y, sm.size * (1 + (1 - a) * 1.6), 0, TAU); ctx.fill(); }
  }
  ctx.globalCompositeOperation = "lighter";
  // roar / stomp rings: bright leading edge; roar rings start at the mouth and drift to the body centre
  for (const r of G.rings) {
    if (r.t < 0) continue;
    const a = Math.max(0, 0.9 - r.t * 1.8) * (r.dim || 1), w = r.w || 10, kk = clamp(r.t / 0.35, 0, 1);
    const px = r.fx === undefined ? r.x : lerp(r.fx, r.x, kk), py = r.fx === undefined ? r.y : lerp(r.fy, r.y, kk);
    ctx.strokeStyle = `rgba(${r.c || "255,220,120"},${a * 0.18})`; ctx.lineWidth = w * 3;
    ctx.beginPath(); ctx.arc(px, py, r.r, 0, TAU); ctx.stroke();
    ctx.strokeStyle = `rgba(${r.c || "255,220,120"},${a * 0.5})`; ctx.lineWidth = w;
    ctx.beginPath(); ctx.arc(px, py, r.r, 0, TAU); ctx.stroke();
    ctx.strokeStyle = `rgba(255,255,255,${a})`; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(px, py, r.r + w * 0.4, 0, TAU); ctx.stroke();
    ctx.strokeStyle = `rgba(${r.c || "255,220,120"},${a * 0.3})`; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(px, py, Math.max(1, r.r - 26), 0, TAU); ctx.stroke();
  }
  // Tremor pulses: compact ground ring with a bright edge (cracks are drawn afterwards)
  for (const w of G.waves) {
    const a = 1 - w.t / w.life;
    ctx.fillStyle = `rgba(255,190,100,${0.08 * a})`; ctx.beginPath(); ctx.arc(w.x, w.y, w.r, 0, TAU); ctx.fill();
    ctx.strokeStyle = `rgba(255,170,80,${0.35 * a})`; ctx.lineWidth = 14; ctx.beginPath(); ctx.arc(w.x, w.y, w.r, 0, TAU); ctx.stroke();
    ctx.strokeStyle = `rgba(255,245,210,${0.9 * a})`; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(w.x, w.y, w.r + 4, 0, TAU); ctx.stroke();
  }
  for (const c of G.crescents) {                    // Lv6 crescent wave
    const a = clamp(c.life / c.max, 0, 1), phi = 0.9, R = c.hw / Math.sin(phi);
    const ccx = c.x - Math.cos(c.ang) * R, ccy = c.y - Math.sin(c.ang) * R;
    ctx.strokeStyle = `rgba(255,200,120,${0.5 * a})`; ctx.lineWidth = 16; ctx.beginPath(); ctx.arc(ccx, ccy, R, c.ang - phi, c.ang + phi); ctx.stroke();
    ctx.strokeStyle = `rgba(255,250,225,${0.95 * a})`; ctx.lineWidth = 5; ctx.beginPath(); ctx.arc(ccx, ccy, R, c.ang - phi, c.ang + phi); ctx.stroke();
  }
  // swipe: 3 parallel curved claw slashes with a bright start flash and fading trail
  for (const s of G.swipes) {
    const prog = clamp((s.max - s.t) / 0.1, 0, 1), e = 1 - (1 - prog) * (1 - prog), fade = clamp(s.t / (s.max * 0.75), 0, 1);
    const a0 = -s.dir * s.arc / 2, cur = lerp(a0, -a0, e), trail = s.arc * Math.max(e, 0.15);
    const fa = clamp(1 - (s.max - s.t) / 0.1, 0, 1);                       // glint at the start of the stroke (arc-shaped, never a dot)
    for (let k = 0; k < 3; k++) {
      const rr = s.r * (0.7 + 0.15 * k), N = 8;          // outermost streak radius == hit range
      if (fa > 0) { ctx.strokeStyle = `rgba(255,250,225,${0.85 * fa})`; ctx.lineWidth = 2 + 7 * fa; ctx.beginPath(); ctx.arc(s.x, s.y, rr, s.ang + a0, s.ang + a0 + s.dir * 0.35, s.dir < 0); ctx.stroke(); }
      for (let i = 0; i < N; i++) {
        const t0 = i / N, t1 = (i + 1) / N;
        ctx.strokeStyle = `rgba(255,${240 - k * 20},${200 - k * 40},${t1 * fade * 0.95})`; ctx.lineWidth = 2 + t1 * 6;
        ctx.beginPath(); ctx.arc(s.x, s.y, rr, s.ang + cur - s.dir * trail * (1 - t0), s.ang + cur - s.dir * trail * (1 - t1), s.dir < 0); ctx.stroke();
      }
    }
  }
  ctx.globalCompositeOperation = "source-over";
  for (const w of G.waves) {                        // dark ground cracks radiating from the pulse
    ctx.strokeStyle = `rgba(30,20,10,${0.6 * (1 - w.t / w.life)})`; ctx.lineWidth = 2; ctx.beginPath();
    for (let i = 0; i < 7; i++) { const a = w.rot + i * TAU / 7; ctx.moveTo(w.x + Math.cos(a) * w.r * 0.25, w.y + Math.sin(a) * w.r * 0.25); ctx.lineTo(w.x + Math.cos(a + 0.12) * w.r * 0.95, w.y + Math.sin(a + 0.12) * w.r * 0.95); }
    ctx.stroke();
  }
  // (tail spin is drawn after the player body, see drawTailSpin)
  // player
  const hurt = G.hurtT > 0 && Math.floor(G.t * 30) % 2 === 0;
  const breathing = act && act.type === "breath" && act.phase === "fire";
  const breathGlow = act && act.type === "breath" ? (act.phase === "wind" ? 0.9 * act.t / BREATH.windup : act.phase === "fire" ? 0.9 : 0.9 * (1 - act.t / BREATH.exhale)) : 0;
  let lunge = 0;                                   // tiny forward lunge on the swipe strike
  if (act && act.type === "swipe" && act.t >= SWIPE.wind) lunge = SWIPE.lunge * Math.sin(Math.PI * clamp((act.t - SWIPE.wind) / (SWIPE.strike + 0.08), 0, 1));
  else if (act && act.type === "swipe") lunge = -SWIPE.lunge * 0.4 * (act.t / SWIPE.wind);   // slight pull-back in the wind-up
  const hb = hasBreath();
  let bodyScale = 1.15;                           // stomp: raise the foot (grow), then slam (squash)
  if (act && act.type === "stomp") bodyScale *= act.t < STOMP.windup ? 1 + 0.07 * (act.t / STOMP.windup) : 1 - 0.05 * Math.max(0, 1 - (act.t - STOMP.windup) / 0.15);
  if (act && act.type === "tailspin") drawTailSpin(P, act);
  drawKaiju(P.x + Math.cos(P.face) * lunge, P.y + Math.sin(P.face) * lunge, P.face, bodyScale, PLAYER_PAL, P.walk, hurt, Math.max(breathGlow, act && act.type === "mega" ? 0.9 : 0),
    { charge: hb ? P.charge / 100 : 0, ready: hb && P.charge >= BREATH.minStart, t: G.t, turn: clamp(P.angVel / (MOVE.turnRate * MOVE.turnStillMul), -1, 1) * MOVE.leanMax, roar: act && act.type === "roar" ? roarPose(act) : null });
  // facing marker (the kaiju turns slowly, so show where it points)
  ctx.fillStyle = "rgba(255,255,255,.25)";
  ctx.beginPath(); ctx.moveTo(P.x + Math.cos(P.face) * 92, P.y + Math.sin(P.face) * 92);
  ctx.lineTo(P.x + Math.cos(P.face + 0.14) * 78, P.y + Math.sin(P.face + 0.14) * 78);
  ctx.lineTo(P.x + Math.cos(P.face - 0.14) * 78, P.y + Math.sin(P.face - 0.14) * 78); ctx.fill();
  // beams (additive): layered outer glow, body, white core, with flicker
  ctx.globalCompositeOperation = "lighter"; ctx.lineCap = "round";
  if (breathing) {
    const sx = P.x + Math.cos(P.face) * 40, sy = P.y + Math.sin(P.face) * 40;
    const ex = P.x + Math.cos(P.face) * P.bl, ey = P.y + Math.sin(P.face) * P.bl;
    const fl = frozen ? 1 : 0.85 + Math.random() * 0.3, bw = P.bw;
    if (breathLevel() >= 6) { ctx.strokeStyle = "rgba(160,100,255,.2)"; ctx.lineWidth = bw * 2.8 * fl; ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(ex, ey); ctx.stroke(); }
    ctx.strokeStyle = "rgba(30,120,255,.18)"; ctx.lineWidth = bw * 1.9 * fl; ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(ex, ey); ctx.stroke();
    ctx.strokeStyle = "rgba(60,200,255,.4)"; ctx.lineWidth = bw * 1.15 * fl; ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(ex, ey); ctx.stroke();
    ctx.strokeStyle = "rgba(200,250,255,.7)"; ctx.lineWidth = bw * 0.6 * (frozen ? 1 : 0.9 + Math.random() * 0.2); ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(ex, ey); ctx.stroke();
    ctx.strokeStyle = "rgba(255,255,255,.95)"; ctx.lineWidth = bw * 0.28 * fl; ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(ex, ey); ctx.stroke();
    ctx.fillStyle = "rgba(160,235,255,.4)"; ctx.beginPath(); ctx.arc(sx, sy, bw * 0.8 * fl, 0, TAU); ctx.fill();   // muzzle flare
    ctx.fillStyle = "rgba(120,220,255,.35)"; ctx.beginPath(); ctx.arc(ex, ey, bw * 0.9 * fl, 0, TAU); ctx.fill();  // end flare
  }
  if (act && act.type === "mega") {
    const sx = P.x + Math.cos(P.face) * 40, sy = P.y + Math.sin(P.face) * 40;
    if (act.t < 0.9) {
      const k = act.t / 0.9;
      ctx.fillStyle = `rgba(120,255,255,${0.3 + 0.5 * k})`; ctx.beginPath(); ctx.arc(sx, sy, 8 + 30 * k, 0, TAU); ctx.fill();
      ctx.strokeStyle = "rgba(160,255,255,.5)"; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(P.x, P.y, 110 * (1 - k) + 30, 0, TAU); ctx.stroke();
    } else {
      const ex = P.x + Math.cos(P.face) * 650, ey = P.y + Math.sin(P.face) * 650, fl = frozen ? 1 : 0.9 + Math.random() * 0.2;
      ctx.strokeStyle = "rgba(60,160,255,.45)"; ctx.lineWidth = 130 * fl; ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(ex, ey); ctx.stroke();
      ctx.strokeStyle = "rgba(230,255,255,.95)"; ctx.lineWidth = 55 * fl; ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(ex, ey); ctx.stroke();
    }
  }
  for (const f of G.flares) {                       // impact flares where the beam hits
    ctx.fillStyle = `rgba(255,220,150,${clamp(f.t / 0.18, 0, 1) * 0.7})`;
    ctx.beginPath(); ctx.arc(f.x, f.y, f.r, 0, TAU); ctx.fill();
  }
  ctx.globalCompositeOperation = "source-over";
  for (const p of G.parts) {
    ctx.globalAlpha = Math.max(0, p.life / p.max); ctx.fillStyle = p.color;
    ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
  }
  ctx.globalAlpha = 1;
  for (const q of G.xpLabels) {                      // subtle merged +XP labels
    ctx.globalAlpha = clamp(q.t / 0.4, 0, 0.85); txt("+" + Math.round(q.v), q.x, q.y - 14, 12, "#d6f0cf", "center");
  }
  ctx.globalAlpha = 1;
  for (const n of G.nums) {                          // floating damage numbers
    ctx.globalAlpha = clamp(n.t / 0.3, 0, 1);
    txt(String(n.v), n.x, n.y, 15, n.color, "center");
  }
  ctx.globalAlpha = 1;
  ctx.restore();
}

function bar(x, y, w, h, frac, fill, back) {
  ctx.fillStyle = back || "rgba(0,0,0,.55)"; ctx.fillRect(x, y, w, h);
  ctx.fillStyle = fill; ctx.fillRect(x, y, w * clamp(frac, 0, 1), h);
  ctx.strokeStyle = "rgba(255,255,255,.5)"; ctx.lineWidth = 1; ctx.strokeRect(x + 0.5, y + 0.5, w, h);
}

// One HUD slot box: label (key), name, cooldown overlay, locked state, busy (another action running).
function slotBox(x, y, label, name, color, cdFrac, cdText, locked, active, busy, lvText) {
  const S = 62;
  ctx.fillStyle = locked ? "rgba(0,0,0,.45)" : "rgba(20,25,40,.8)"; ctx.fillRect(x, y, S, S);
  ctx.strokeStyle = locked ? "rgba(255,255,255,.2)" : color; ctx.lineWidth = active ? 4 : 2;
  if (locked) ctx.setLineDash([4, 4]);
  ctx.strokeRect(x, y, S, S); ctx.setLineDash([]);
  if (locked) { txt("?", x + S / 2, y + 38, 26, "rgba(255,255,255,.25)"); }
  else {
    txt(name, x + S / 2, y + 34, 11, "#fff");
    if (cdFrac > 0) {
      ctx.fillStyle = "rgba(0,0,0,.65)"; ctx.fillRect(x, y, S, S * cdFrac);
      txt(cdText, x + S / 2, y + 48, 14, "#fff");
    } else { ctx.fillStyle = color; ctx.globalAlpha = 0.25; ctx.fillRect(x, y + S - 6, S, 6); ctx.globalAlpha = 1; }
    if (busy && !active) {                   // locked out while another action is running
      ctx.fillStyle = "rgba(60,60,70,.7)"; ctx.fillRect(x, y, S, S);
      ctx.strokeStyle = "rgba(255,255,255,.25)"; ctx.lineWidth = 2; ctx.beginPath();
      for (let k = -S; k < S; k += 12) { ctx.moveTo(x + k, y + S); ctx.lineTo(x + k + S, y); }
      ctx.save(); ctx.beginPath(); ctx.rect(x, y, S, S); ctx.clip(); ctx.stroke(); ctx.restore();
      txt("BUSY", x + S / 2, y + 36, 11, "#ccc");
    }
  }
  if (lvText && !locked) txt(lvText, x + 4, y + 12, 10, "#fff", "left");
  txt(label, x + S / 2, y + S + 14, 12, locked ? "#777" : "#ddd");
}

function drawHUD() {
  const P = G.P, act = P.action, at = act ? act.type : null;
  bar(16, 16, 250, 20, P.hp / P.maxHp, P.hp / P.maxHp > 0.3 ? "#d33" : "#f55");
  txt(`HP ${Math.ceil(P.hp)} / ${P.maxHp}`, 141, 32, 14, "#fff");
  bar(16, 42, 250, 12, P.xp / xpNeed(P.lvl), "#4e8");
  if (G.xpPulse > 0) { ctx.fillStyle = `rgba(200,255,220,${0.5 * G.xpPulse})`; ctx.fillRect(16, 42, 250 * clamp(P.xp / xpNeed(P.lvl), 0, 1), 12); ctx.strokeStyle = `rgba(200,255,220,${0.8 * G.xpPulse})`; ctx.lineWidth = 2; ctx.strokeRect(15, 41, 252, 14); }
  // breath charge tank with the usable threshold marked
  const hasB = hasBreath(), ready = hasB && P.charge >= BREATH.minStart;
  if (hasB) {
  bar(16, 60, 250, 12, P.charge / 100, ready ? "#8cf" : "#c83");
  ctx.fillStyle = "#fff"; ctx.fillRect(16 + 250 * BREATH.minStart / 100 - 1, 57, 2, 18);
  txt(P.failT > 0 ? "NOT ENOUGH CHARGE!" : ready ? "Breath ready" : "Breath charging...", 272, 71, 11, P.failT > 0 ? "#f66" : ready ? "#9df" : "#fb7", "left", false);
  }
  txt(`LV ${P.lvl}`, 16, 94, 16, "#cfe", "left");
  txtShadow(fmtTime(G.t), W / 2, 36, 28, "#fff");
  if (G.nextBoss < BOSS_TIMES.length)
    txt(`Next rival: ${BOSSES[G.nextBoss].name} at ${fmtTime(BOSS_TIMES[G.nextBoss])}`, W / 2, 56, 12, "rgba(255,255,255,.6)", "center", false);
  txt(`Stomped: ${G.kills}`, W - 16, 32, 18, "#fff", "right");
  txt(`Buildings flattened: ${G.destroyed}`, W - 16, 54, 14, "#fc8", "right");
  txt(muted ? "M: sound OFF" : "M: sound on", W - 16, 72, 11, "rgba(255,255,255,.4)", "right", false);
  if (G.combo.n >= 5) txtShadow(`x${G.combo.n} COMBO`, W - 16, 106, Math.min(40, 20 + G.combo.n * 0.4), "#ffd24a", "right");

  // --- bottom-centre: LMB swipe, RMB breath, Q, E, SPACE
  const S = 62, gap = 10, total = 5 * S + 4 * gap, x0 = W / 2 - total / 2, y0 = H - S - 34, busy = !!act;
  slotBox(x0, y0, "LMB", "Swipe", "#fa4", P.swipeCd > 0 ? P.swipeCd / swipeCdNow() : 0, P.swipeCd.toFixed(1), false, at === "swipe", busy, "Lv " + swipeLevel());
  slotBox(x0 + S + gap, y0, "RMB", "Breath", "#4cf", ready ? 0 : 1 - P.charge / BREATH.minStart, Math.floor(P.charge) + "%", !hasB, at === "breath", busy, hasB ? "Lv " + breathLevel() : "");
  if (act && act.type === "breath") {              // wind-up / exhale indicator on the RMB slot
    const bx = x0 + S + gap, k = act.phase === "wind" ? act.t / BREATH.windup : act.phase === "exhale" ? 1 - act.t / BREATH.exhale : 1;
    ctx.fillStyle = "rgba(0,0,0,.6)"; ctx.fillRect(bx, y0 - 8, S, 6);
    ctx.fillStyle = act.phase === "wind" ? "#bff" : act.phase === "exhale" ? "#9ab" : "#fff"; ctx.fillRect(bx, y0 - 8, S * clamp(k, 0, 1), 6);
    txt(act.phase === "wind" ? "CHARGING" : act.phase === "exhale" ? "EXHALE" : "FIRING", bx + S / 2, y0 - 12, 10, "#cde");
  }
  for (let i = 0; i < 3; i++) {
    const id = P.slots[i], bx = x0 + (2 + i) * (S + gap);
    if (!id) slotBox(bx, y0, SLOT_LABELS[i], "", "#fff", 0, "", true, false, false);
    else slotBox(bx, y0, SLOT_LABELS[i], ABILS[id].name.split(" ").pop(), ABILS[id].color, P.cds[id] > 0 ? P.cds[id] / abilCd(id) : 0, P.cds[id].toFixed(1), false, at === id, busy);
  }
  // boss bars
  const bs = bossesAlive();
  bs.forEach((b, i) => {
    const y = 78 + i * 34;
    bar(W / 2 - 220, y, 440, 16, b.hp / b.maxHp, b.inv ? "#999" : b.def.id === "omega" ? "#e43" : "#a4c", "rgba(0,0,0,.6)");
    for (const f of b.def.phaseAt) { ctx.fillStyle = "#fff"; ctx.fillRect(W / 2 - 220 + 440 * f, y - 2, 2, 20); }   // phase markers
    txt(b.def.name + `  (phase ${b.phase}/${b.def.phaseAt.length + 1})` + (b.tired ? "  TIRED!" : ""), W / 2, y + 30, 13, b.tired ? "#ffe27a" : "#fbd");
  });
  // off-screen boss arrows
  for (const b of bs) {
    const sx = W / 2 + (b.x - G.cam.x) * G.zoom, sy = H / 2 + (b.y - G.cam.y) * G.zoom;
    if (sx > 30 && sx < W - 30 && sy > 30 && sy < H - 30) continue;
    const a = Math.atan2(sy - H / 2, sx - W / 2), ex = clamp(W / 2 + Math.cos(a) * W, 40, W - 40), ey = clamp(H / 2 + Math.sin(a) * H, 40, H - 40);
    ctx.save(); ctx.translate(ex, ey); ctx.rotate(a); ctx.fillStyle = "#f55";
    ctx.beginPath(); ctx.moveTo(18, 0); ctx.lineTo(-10, -12); ctx.lineTo(-10, 12); ctx.fill(); ctx.restore();
  }
  if (bs.length) { ctx.fillStyle = `rgba(${bs[0].def.tint},${0.06 * clamp((1 - G.zoom) / (1 - BOSS_ZOOM), 0, 1)})`; ctx.fillRect(0, 0, W, H); }   // subtle per-boss arena tint
  // boss intro: dim edges + cinematic bars
  if (G.introT > 0 && G.introBoss) {
    const k = Math.min(1, G.introT / 0.4, (2.6 - G.introT) / 0.3 + 0.01);
    ctx.fillStyle = `rgba(120,0,0,${0.18 * k})`; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = "#000"; ctx.fillRect(0, 0, W, 54 * k); ctx.fillRect(0, H - 54 * k, W, 54 * k);
    ctx.globalAlpha = k; txtShadow("WARNING: " + G.introBoss.name, W / 2, H / 2 - 120, 44, "#ff6a5a");
    txt(G.introBoss.sub, W / 2, H / 2 - 88, 18, "#fff", "center", false); ctx.globalAlpha = 1;
  } else if (G.banner) {
    const a = Math.min(1, G.banner.t / 0.5, (G.banner.max - G.banner.t) / 0.2 + 0.2);
    ctx.globalAlpha = clamp(a, 0, 1); txtShadow(G.banner.text, W / 2, H * 0.25, 40, "#ffd24a"); ctx.globalAlpha = 1;
  }
  if (G.hurtT > 0) { ctx.fillStyle = `rgba(255,0,0,${G.hurtT * 0.5})`; ctx.fillRect(0, 0, W, H); }
  if (state === "play") {                              // crosshair
    ctx.strokeStyle = P.failT > 0 ? "#f55" : ready ? "#bff" : "#fff"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(mouse.x, mouse.y, 11, 0, TAU);
    ctx.moveTo(mouse.x - 18, mouse.y); ctx.lineTo(mouse.x - 6, mouse.y); ctx.moveTo(mouse.x + 6, mouse.y); ctx.lineTo(mouse.x + 18, mouse.y);
    ctx.moveTo(mouse.x, mouse.y - 18); ctx.lineTo(mouse.x, mouse.y - 6); ctx.moveTo(mouse.x, mouse.y + 6); ctx.lineTo(mouse.x, mouse.y + 18);
    ctx.stroke();
  }
}

const CARD = { w: 230, h: 250, gap: 28 };
function cardRect(i) {
  const total = G.choices.length * CARD.w + (G.choices.length - 1) * CARD.gap;
  return { x: W / 2 - total / 2 + i * (CARD.w + CARD.gap), y: H / 2 - CARD.h / 2 + 20, w: CARD.w, h: CARD.h };
}
function drawLevelUp() {
  ctx.fillStyle = "rgba(0,0,0,.65)"; ctx.fillRect(0, 0, W, H);
  txtShadow("LEVEL UP!", W / 2, H / 2 - CARD.h / 2 - 20, 44, "#ffd24a");
  txt("Click a card or press 1 / 2 / 3", W / 2, H / 2 - CARD.h / 2 + 8, 15, "#ccc", "center", false);
  G.choices.forEach((u, i) => {
